name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository rules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: strict types
        run: npm run typecheck
      - name: tooling tests, with the coverage floor
        run: npm test
      - name: prompt budgets and duplicates only fall
        run: npm run -s prompts > /dev/null
      - name: context by scenario, and this pull request's difference
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          { echo '### Context by scenario'; echo; npm run -s context -- --base "$base"; } >> "$GITHUB_STEP_SUMMARY"
      - name: the rules a prompt states that nothing holds (a report)
        run: |
          { echo '### Rules held by prose alone'; echo; npm run -s rules | sed -n '1,11p'; } >> "$GITHUB_STEP_SUMMARY"
      - name: dependencies declared with a range, no cycle, no import outside its plugin
        run: npm run deps
      - name: no committed permission grant, every installer rule listed
        run: npm run permissions
      - name: every plugin's copy of core matches the source
        run: npm run core -- --check
      - name: catalogue matches the manifests
        run: npm run marketplace -- --check
      - id: matrix
        name: plugin matrix
        # A pull request runs Linux, for the plugins it changes; main runs every cell.
        run: npm run -s plugin-matrix -- ${{ github.event_name == 'pull_request' && format('--pull-request origin/{0}', github.base_ref) || '' }}

  plugin:
    name: ${{ matrix.plugin }} on ${{ matrix.os }}${{ matrix.shard && format(' (part {0})', matrix.shard) || '' }}${{ !matrix.blocking && ' (not yet blocking)' || '' }}
    needs: repository
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.repository.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # A pull request that touches no plugin runs one cell without a suite: a skipped job proves
      # nothing to the gate, a job that passes does.
      - name: tools the suites call
        if: matrix.plugin != 'no plugin suite'
        run: |
          # Bun from the npm registry: its GitHub release downloads fail on a forge outage.
          npm install --global --silent @anthropic-ai/claude-code@2.1.319 bun@1.4.4
          python -m pip install --quiet pytest
          if [ "$RUNNER_OS" = Linux ]; then
            # The Ubuntu mirrors failed from the runner's DNS on 2026-11-11. apt is given its own
            # retries for downloads; the install itself gets three attempts. The setting stays for
            # the drift step's install-deps, which runs apt-get on this runner.
            echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
            for attempt in 1 2 3; do
              sudo apt-get install -y -qq tmux jq && break
              [ "$attempt" = 3 ] && { echo "::error::tools the suites call: apt-get install tmux jq failed after 3 attempts"; exit 1; }
              echo "::warning::apt-get install tmux jq failed (attempt $attempt of 3), retrying"
              sleep $((attempt * 30))
            done
          else
            brew install tmux jq
          fi
      - name: the superpowers plugin implement's skills stand on
        if: matrix.plugin == 'implement'
        run: |
          git clone --quiet --depth 1 --branch v7.0.2 https://github.com/obra/superpowers "$RUNNER_TEMP/superpowers"
          echo "SUPERPOWERS_ROOT=$RUNNER_TEMP/superpowers" >> "$GITHUB_ENV"
      - name: the runner's image, which the expressions below cannot read from its environment
        if: matrix.plugin == 'drift'
        run: echo "RUNNER_IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
      - name: the pinned Playwright drift drives, cached by the core module that pins it
        if: matrix.plugin == 'drift'
        uses: actions/cache@v4
        with:
          path: ~/.claude/playwright
          # A browser downloaded on one image or architecture never runs on another.
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE_OS }}-${{ hashFiles('packages/core/src/playwright.ts') }}
      - name: install it through core, then the system libraries its Chromium needs on Linux
        if: matrix.plugin == 'drift'
        # The libraries come from a fresh download of the pinned version, never from the restored
        # cache: nothing the cache holds runs as root.
        run: |
          plugins/drift/install.sh
          if [ "$RUNNER_OS" = Linux ]; then
            pin=$(sed -n "s/^export const PLAYWRIGHT_VERSION = '\([0-9.]*\)'$/\1/p" packages/core/src/playwright.ts)
            [ -n "$pin" ] || { echo "no PLAYWRIGHT_VERSION in packages/core/src/playwright.ts"; exit 1; }
            # Three attempts with a growing pause: a transient mirror or DNS failure must not fail the job alone.
            for attempt in 1 2 3; do
              sudo env "PATH=$PATH" npx --yes "playwright@$pin" install-deps chromium && break
              [ "$attempt" = 3 ] && { echo "::error::drift: playwright install-deps chromium failed after 3 attempts"; exit 1; }
              echo "::warning::playwright install-deps chromium failed (attempt $attempt of 3), retrying"
              sleep $((attempt * 30))
            done
          fi
      - name: suite
        if: matrix.plugin != 'no plugin suite'
        env:
          CLAUDE_GITHUB_ROOT: ${{ github.workspace }}/plugins/github
          LC_ALL: en_US.UTF-8
          BLOCKING: ${{ matrix.blocking }}
          # The part of a suite split in parts; empty runs the whole suite.
          SUITE_SHARD: ${{ matrix.shard }}
        # A suite not yet green here reports its failure as a warning, so the pull request is red
        # only when a blocking check fails. The warning quotes the suite's last line: a count of
        # failed cases reads apart from a suite that died before its summary.
        run: |
          set -o pipefail
          if plugins/${{ matrix.plugin }}/tests/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"; then exit 0; fi
          if [ "$BLOCKING" = true ]; then exit 1; fi
          last=$(tail -n 1 "$RUNNER_TEMP/suite.log")
          echo "::warning title=${{ matrix.plugin }} on ${{ matrix.os }}::the suite fails here, its last line: ${last}; it does not block until it is green (ci/plugins.json)"
