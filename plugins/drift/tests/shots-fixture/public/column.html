<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Column</title>
<style>
  body { margin: 0; background: #ffffff; }
  /* A grey column between black and white: what the comparator takes for an anti-aliased edge. */
  #block { position: absolute; left: 20px; top: 10px; width: 30px; height: 30px; background: #000000; }
  #column { position: absolute; left: 50px; top: 10px; width: 1px; height: 30px; background: rgb(128, 128, 128); }
</style>
</head>
<body>
<div id="block"></div>
<div id="column"></div>
</body>
</html>
