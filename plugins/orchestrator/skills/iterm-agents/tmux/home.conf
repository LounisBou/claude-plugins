# home.conf - the configuration of an orchestrator's home server, and of nothing else: the
# launcher starts each home server with `-f` on this file, so the operator's own tmux setup is
# neither read here nor touched.

# The mark the launcher reads on the caller's pane: in a session that carries it, an agent is
# a window of that session. Set on each session as it is made, since the launcher reads the
# session's own option and not the global one.
set-hook -g session-created "set-option @orchestrator-home 1"

# The host reads focus changes and the modified keys: Shift-Enter inserts a newline instead of
# submitting only when tmux passes it on as an extended key, and asks the terminal for them.
# The options newer than the oldest tmux supported (extended-keys and terminal-features, 3.2;
# extended-keys-format, 3.5) are set quietly: an older tmux ignores the line instead of printing
# an error in the home session.
set -g focus-events on
set -gq extended-keys always
set -gq extended-keys-format csi-u
set -asq terminal-features 'xterm*:extkeys'

# A window keeps the name the launcher gave it: renamed after its program, it would read the
# host's version number.
set -g automatic-rename off
set -g mouse on

# The iTerm2 tab reads the title of the window it shows, the host's own title with its glyph.
set -g set-titles on
set -g set-titles-string '#T'

# The default prefix, and a second press sends it through to the program in the pane.
set -g prefix C-b
bind C-b send-prefix

# The tab bar: each window is a button-like block (its own background, a space of padding on
# each side) showing its name and, once its session has written a state, that state's icon after
# the name: busy ▶, idle ●, asks ✋, held ⏸, review ⧖, done ✓, over ⏹, gate ⚠ (the legend, with what
# the operator does for each, is the table in the plugin's README). The module writes the state
# word in @state on its own window when it changes; the orchestrator's stop gate, which reads each
# idle agent's pull request, writes `over` on the window of one whose pull request is merged or
# closed and moves a delivery between review and done by the Ready label. The status line only
# maps the word to an icon, nothing polls, and a window with no state, or one this map does not
# know, shows no icon. Clicking a block selects its window through tmux's default MouseDown1Status
# binding, left alone. Colours are plain #rrggbb, every pair at least 7:1 (WCAG AAA): bar #ffffff
# on #1c1c1c 17.0, inactive #e4e4e4 on #303030 10.4, current #000000 on #ffd75f 15.1. Each icon has
# one colour, the same on every tab: on an inactive tab it is drawn on #303030, and on the current
# tab in a small #303030 block of its own, so the yellow never changes it (the yellow held 7:1 only
# with darkened colours, and a dark blue disc read as a dark empty one). On #303030: busy #5fd75f
# 7.1, idle #87d7ff 8.3, asks #ffaf5f 7.3, held #d0d0d0 8.6, review #d7afff 7.2, done #afff5f 10.9,
# gate #ffafaf 7.5. A red glyph cannot reach 7:1 on #303030, so over is a red block: #000000 on
# #ff5f5f 7.1, the same on both. Working and delivered are two greens, deep and pale. No index: it
# only added noise. A style that sets two attributes is written as two #[...]: a comma inside a
# conditional's branch would end it.
set -g status-style 'fg=#ffffff,bg=#1c1c1c'
# The session name is of no use here: one session, named by the launcher.
set -g status-left ''
# Nor the right end: the pane title repeats the window's own block, and a clock means nothing here.
set -g status-right ''
# One plain space between two blocks lets the bar show through, so neighbours never read as one.
set -g window-status-separator ' '
set -g window-status-format '#[fg=#e4e4e4,bg=#303030] #W#{?#{==:#{@state},busy}, #[fg=#5fd75f]▶ ,#{?#{==:#{@state},idle}, #[fg=#87d7ff]● ,#{?#{==:#{@state},asks}, #[fg=#ffaf5f]✋ ,#{?#{==:#{@state},held}, #[fg=#d0d0d0]⏸ ,#{?#{==:#{@state},review}, #[fg=#d7afff]⧖ ,#{?#{==:#{@state},done}, #[fg=#afff5f]✓ ,#{?#{==:#{@state},over},#[fg=#000000]#[bg=#ff5f5f] ⏹ ,#{?#{==:#{@state},gate}, #[fg=#ffafaf]⚠ , }}}}}}}}#[default]'
# The current window is bold on a brighter background, its icon in a block of its own.
set -g window-status-current-format '#[fg=#000000,bg=#ffd75f,bold] #W#{?#{==:#{@state},busy},#[fg=#5fd75f]#[bg=#303030]#[nobold] ▶ ,#{?#{==:#{@state},idle},#[fg=#87d7ff]#[bg=#303030]#[nobold] ● ,#{?#{==:#{@state},asks},#[fg=#ffaf5f]#[bg=#303030]#[nobold] ✋ ,#{?#{==:#{@state},held},#[fg=#d0d0d0]#[bg=#303030]#[nobold] ⏸ ,#{?#{==:#{@state},review},#[fg=#d7afff]#[bg=#303030]#[nobold] ⧖ ,#{?#{==:#{@state},done},#[fg=#afff5f]#[bg=#303030]#[nobold] ✓ ,#{?#{==:#{@state},over},#[fg=#000000]#[bg=#ff5f5f]#[nobold] ⏹ ,#{?#{==:#{@state},gate},#[fg=#ffafaf]#[bg=#303030]#[nobold] ⚠ , }}}}}}}}#[default]'
